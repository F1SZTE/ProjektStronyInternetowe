
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #181818;
            color: white;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: #292929;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        button {
            padding: 12px 25px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #6025c9;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hello, World!</h1>
        <p>Welcome to my first website.</p>
        <img src="https://placehold.co/400x200/7c3aed/ffffff?text=My+Website"
             alt="Website image" style="max-width: 100%; border-radius: 10px;">
        <p id="message">Click the button below!</p>
        <button onclick="changeText()">Click me</button>
    </div>

    <script>
        function changeText() {
            document.getElementById("message").textContent =
                "It works! Your website is alive.";
        }
    </script>
</body>
</html>
